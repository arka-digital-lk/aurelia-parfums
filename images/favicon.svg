<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="30" fill="#0B0B0C" stroke="#D4AF37" stroke-width="2.5"/>
  <!-- Cap -->
  <rect x="27" y="12" width="10" height="7" rx="1.5" fill="#D4AF37"/>
  <!-- Neck -->
  <rect x="29" y="19" width="6" height="5" fill="#F3E5AB"/>
  <!-- Body -->
  <path d="M 19 28 C 19 24, 45 24, 45 28 L 45 48 C 45 52, 19 52, 19 48 Z" fill="url(#gold-grad)" stroke="#D4AF37" stroke-width="1.5"/>
  <!-- Reflection Shine -->
  <line x1="24" y1="28" x2="24" y2="47" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#AA7C11"/>
