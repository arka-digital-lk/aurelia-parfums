<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Login — AURELIA PARFUMS</title>
  <meta name="description" content="Sign in to your AURELIA PARFUMS account to track orders and manage your profile." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600&family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body style="background: #faf7f2; min-height: 100vh; display: flex; flex-direction: column;">

  <!-- NAVBAR -->
  <header class="navbar scrolled" id="navbar">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo" style="text-decoration:none;">
        <span class="logo-text">AURELIA</span>
        <span class="logo-sub">PARFUMS</span>
      </a>
      <nav class="nav-links" id="nav-links">
        <a href="../index.html#home" class="nav-link">Home</a>
        <a href="../index.html#collections" class="nav-link">Shop</a>
        <a href="../index.html#about" class="nav-link">About</a>
        <a href="../index.html#contact" class="nav-link">Contact</a>
      </nav>
    </div>
  </header>

  <!-- LOGIN CARD CONTAINER -->
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 120px 24px 60px;">
    <div style="background: #ffffff; width: 100%; max-width: 440px; padding: 40px 36px; border-radius: 24px; box-shadow: 0 24px 64px rgba(10,6,2,0.08); border: 1px solid var(--cream-dark); font-family: 'Jost', sans-serif;">
      
      <div style="text-align: center; margin-bottom: 28px;">
        <h1 style="font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; font-weight: 500; color: var(--charcoal); margin-bottom: 6px;">Welcome Back</h1>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Sign in to your AURELIA account</p>
      </div>

      <!-- Feedback Message -->
      <div id="login-msg" style="display: none;"></div>

      <form id="dedicated-login-form">
        <div style="margin-bottom: 14px;">
          <label for="login-email" style="display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; color: var(--charcoal);">Email Address <span style="color:#c0392b;">*</span></label>
          <input type="email" id="login-email" required placeholder="your@email.com" autocomplete="email" style="width: 100%; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--cream-dark); font-family: 'Jost', sans-serif; font-size: 0.88rem; outline: none;" />
        </div>

        <div style="margin-bottom: 16px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
            <label for="login-password" style="font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--charcoal);">Password <span style="color:#c0392b;">*</span></label>
            <a href="#" style="font-size: 0.76rem; color: var(--gold); text-decoration: none;">Forgot?</a>
          </div>
          <div style="position: relative;">
            <input type="password" id="login-password" required placeholder="Enter your password" autocomplete="current-password" style="width: 100%; padding: 10px 40px 10px 14px; border-radius: 10px; border: 1.5px solid var(--cream-dark); font-family: 'Jost', sans-serif; font-size: 0.88rem; outline: none;" />
            <button type="button" class="toggle-pw" data-target="login-password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 0.8rem;">👁️</button>
          </div>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-dark" style="width: 100%; padding: 12px; border-radius: 100px; font-size: 0.82rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 16px;">Sign In</button>
      </form>

      <div style="text-align: center; border-top: 1px solid var(--cream-dark); padding-top: 20px;">
        <p style="font-size: 0.82rem; color: var(--text-muted);">
          New customer? <a href="register.html" style="color: var(--charcoal); font-weight: 600; text-decoration: underline;">Create an account →</a>
        </p>
      </div>

    </div>
  </main>

  <footer class="footer" style="margin-top: auto;">
    <div class="footer-bottom">
      <p>&copy; 2026 Aurelia Parfums (Pvt) Ltd. All rights reserved.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
