<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — AURELIA PARFUMS</title>
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg" />
  <link rel="alternate icon" type="image/png" href="../images/favicon.png" />
  <meta name="description" content="Register an account with AURELIA PARFUMS for exclusive offers, faster checkout, and order history." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600&family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body style="background: #faf7f2; min-height: 100vh; display: flex; flex-direction: column;">

  <!-- NAVBAR -->
  <header class="navbar scrolled" id="navbar">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo" style="text-decoration:none;">
        <span class="logo-text">AURELIA</span>
        <span class="logo-sub">PARFUMS</span>
      </a>
      <nav class="nav-links" id="nav-links">
        <a href="../index.html#home" class="nav-link">Home</a>
        <a href="../index.html#collections" class="nav-link">Shop</a>
        <a href="../index.html#about" class="nav-link">About</a>
        <a href="../index.html#contact" class="nav-link">Contact</a>
      </nav>
    </div>
  </header>

  <!-- REGISTER CARD CONTAINER -->
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 120px 24px 60px;">
    <div style="background: #ffffff; width: 100%; max-width: 480px; padding: 40px 36px; border-radius: 24px; box-shadow: 0 24px 64px rgba(10,6,2,0.08); border: 1px solid var(--cream-dark); font-family: 'Jost', sans-serif;">
      
      <div style="text-align: center; margin-bottom: 28px;">
        <h1 style="font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; font-weight: 500; color: var(--charcoal); margin-bottom: 6px;">Create Account</h1>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Join the AURELIA Circle</p>
      </div>

      <!-- Feedback Message -->
      <div id="register-msg" style="display: none;"></div>

      <form id="dedicated-register-form">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
          <div>
            <label for="reg-firstname" style="display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; color: var(--charcoal);">First Name <span style="color:#c0392b;">*</span></label>
            <input type="text" id="reg-firstname" required placeholder="First Name" autocomplete="given-name" style="width: 100%; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--cream-dark); font-family: 'Jost', sans-serif; font-size: 0.88rem; outline: none;" />
          </div>
          <div>
            <label for="reg-lastname" style="display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; color: var(--charcoal);">Last Name</label>
            <input type="text" id="reg-lastname" placeholder="Last Name" autocomplete="family-name" style="width: 100%; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--cream-dark); font-family: 'Jost', sans-serif; font-size: 0.88rem; outline: none;" />
          </div>
        </div>

        <div style="margin-bottom: 12px;">
          <label for="reg-email" style="display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; color: var(--charcoal);">Email Address <span style="color:#c0392b;">*</span></label>
          <input type="email" id="reg-email" required placeholder="your@email.com" autocomplete="email" style="width: 100%; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--cream-dark); font-family: 'Jost', sans-serif; font-size: 0.88rem; outline: none;" />
        </div>

        <div style="margin-bottom: 12px;">
          <label for="reg-password" style="display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; color: var(--charcoal);">Password <span style="color:#c0392b;">*</span></label>
          <div style="position: relative;">
            <input type="password" id="reg-password" required placeholder="Min 6 characters" autocomplete="new-password" style="width: 100%; padding: 10px 40px 10px 14px; border-radius: 10px; border: 1.5px solid var(--cream-dark); font-family: 'Jost', sans-serif; font-size: 0.88rem; outline: none;" />
            <button type="button" class="toggle-pw" data-target="reg-password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 0.8rem;">👁️</button>
          </div>
        </div>

        <div style="margin-bottom: 16px;">
          <label for="reg-confirm" style="display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; color: var(--charcoal);">Confirm Password <span style="color:#c0392b;">*</span></label>
          <div style="position: relative;">
            <input type="password" id="reg-confirm" required placeholder="Repeat password" autocomplete="new-password" style="width: 100%; padding: 10px 40px 10px 14px; border-radius: 10px; border: 1.5px solid var(--cream-dark); font-family: 'Jost', sans-serif; font-size: 0.88rem; outline: none;" />
            <button type="button" class="toggle-pw" data-target="reg-confirm" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 0.8rem;">👁️</button>
          </div>
        </div>

        <button type="submit" id="register-submit-btn" class="btn btn-dark" style="width: 100%; padding: 12px; border-radius: 100px; font-size: 0.82rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 16px;">Create Account</button>
      </form>

      <div style="text-align: center; border-top: 1px solid var(--cream-dark); padding-top: 20px;">
        <p style="font-size: 0.82rem; color: var(--text-muted);">
          Already have an account? <a href="login.html" style="color: var(--charcoal); font-weight: 600; text-decoration: underline;">Log in here →</a>
        </p>
      </div>

    </div>
  </main>

  <footer class="footer" style="margin-top: auto;">
    <div class="footer-bottom">
      <p>&copy; 2026 Aurelia Parfums (Pvt) Ltd. All rights reserved.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
